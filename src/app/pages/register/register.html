<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BanEcuador - Registro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="register-container">

    <div class="hero-section">

      <div class="brand">
        <span>BanEcuador</span>
      </div>

      <h1 class="hero-title">
        Simulador de Crédito
      </h1>

      <p class="hero-text">
        Crea tu cuenta en pocos pasos para acceder al simulador
        de crédito y calcular las mejores opciones financieras
        según tus necesidades.
      </p>

    </div>

    <div class="form-section">

      <h2 class="form-title">
        Registro
      </h2>

      <form (ngSubmit)="onRegister()">

        <div class="form-group">

          <label for="nombre">
            Nombre
          </label>

          <div class="input-wrapper">

            <input
              type="text"
              id="nombre"
              name="name"
              [(ngModel)]="name"
              placeholder="Ingresa tu nombre"
              required
            />

          </div>

        </div>

        <div class="form-group">

          <label for="email">
            Correo Electrónico / Gmail
          </label>

          <div class="input-wrapper">

            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="ejemplo@correo.com"
              required
            />

          </div>

        </div>

        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
            />

          </div>

        </div>

        <div class="form-group">

          <label for="confirm-password">
            Confirmar Contraseña
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="••••••••"
              required
            />

          </div>

        </div>

        <p
          class="error-message"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>

<p
          class="success-message"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </p>

        <button
          type="submit"
          class="btn-submit"
        >
          Registrarse
        </button>

        <p class="helper-text">

          ¿Ya tienes una cuenta?

          <a routerLink="/login">
            Inicia sesión
          </a>

        </p>

      </form>

    </div>

  </div>

</body>
</html>
